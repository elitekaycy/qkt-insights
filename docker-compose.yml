services:
  insights:
    build: .
    command: run
    # Loopback only: put a TLS reverse proxy in front (docs/operations/internet-exposure.md).
    ports: ["127.0.0.1:8420:8420"]
    volumes: ["insights-data:/data"]
    environment:
      INSIGHTS_DB: /data/insights.db
      INGEST_TOKEN: ${INGEST_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      INSIGHTS_NAME: ${INSIGHTS_NAME:-}
      INSIGHTS_MONITORS: ${INSIGHTS_MONITORS:-}
      INSIGHTS_MARKETDATA_MONITOR: ${INSIGHTS_MARKETDATA_MONITOR:-}
      INSIGHTS_MARKETDATA_ALERT_AFTER_S: ${INSIGHTS_MARKETDATA_ALERT_AFTER_S:-}
      STRATEGY_CAPITAL: ${STRATEGY_CAPITAL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      DEADMAN_URL: ${DEADMAN_URL:-}
volumes: { insights-data: {} }
