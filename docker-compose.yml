services:
  insights:
    build: .
    command: run
    ports: ["8420:8420"]
    volumes: ["insights-data:/data"]
    environment:
      INSIGHTS_DB: /data/insights.db
      INGEST_TOKEN: ${INGEST_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
volumes: { insights-data: {} }
