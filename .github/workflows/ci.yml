name: ci

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  # Manual rebuild of the image from main, for when a merge push produced no run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:all
      - run: pnpm test

  docker-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: qkt-insights:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot image and verify ingest path
        run: |
          set -euo pipefail
          docker run -d --rm --name qkt-insights-ci \
            -p 8420:8420 \
            -e INSIGHTS_DB=/data/insights.db \
            -e INGEST_TOKEN=ci-token \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=admin-pass \
            -e SESSION_SECRET=ci-session-secret-at-least-32-chars \
            qkt-insights:ci run
          trap 'docker logs qkt-insights-ci || true; docker rm -f qkt-insights-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8420/healthz | grep -q '"ok":true' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8420/healthz | grep -q '"ok":true'

          for i in $(seq 1 30); do
            code=$(curl -fsS -o /tmp/ingest.out -w "%{http_code}" \
              -H "Authorization: Bearer ci-token" \
              -H "Content-Type: application/json" \
              --data '{"instanceId":"ci","events":[]}' \
              http://127.0.0.1:8420/ingest || true)
            if [ "$code" = "200" ]; then
              grep -q '"accepted":0' /tmp/ingest.out
              exit 0
            fi
            sleep 1
          done
          echo "qkt-insights image did not accept an ingest smoke request" >&2
          exit 1

  docker:
    needs: docker-smoke
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
